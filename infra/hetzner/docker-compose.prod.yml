# Pantheon OS — Production Docker Compose (Hetzner CX21)
# Frankfurt DC, 2 vCPU, 4 GB RAM
#
# Services:
#   ibgateway   — Interactive Brokers Gateway (headless, paper port 4002)
#   zeus        — trading pipeline (port 8080)
#   dashboard   — FastAPI WebSocket backend (port 8081)
#   grafana     — analytics dashboards (port 3000, proxied via nginx)
#   redis       — local cache fallback
#   nginx       — SSL termination + reverse proxy

services:

  # ── IB Gateway (headless paper trading) ────────────────────────
  # ghcr.io/gnzsnz/ib-gateway:stable — tracks the stable release line (10.45.1g as of Jun 2026).
  # Switched from pinned 10.30 — confirmed by community that :stable jars are intact and
  # :latest has a known packaging issue (missing jars folder). Do not use :latest.
  # EXISTING_SESSION_DETECTED_ACTION=primary: dismisses any pre-existing
  # IBKR session so headless login always succeeds unattended.
  # Paper port 4002 is internal only — Ares/Argus connect via service name.
  ibgateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: pantheon_ibgateway
    restart: unless-stopped
    labels:
      - "autoheal=true"
    environment:
      - TWS_USERID=${IB_USERNAME}
      - TWS_PASSWORD=${IB_PASSWORD}
      - TRADING_MODE=paper
      - EXISTING_SESSION_DETECTED_ACTION=primary
      - TWS_ACCEPT_INCOMING=accept
      - READ_ONLY_API=no
      - TZ=Europe/Berlin
      - TWOFA_DEVICE=TOTP
      - IBC_TOTP_SECRET=${IBC_TOTP_SECRET}
      - AUTO_RESTART_TIME=02:00 AM
      - TWS_COLD_RESTART=
      - TWOFA_TIMEOUT_ACTION=restart
      - RELOGIN_AFTER_TWOFA_TIMEOUT=yes
      - TRUSTED_IPS=172.19.0.0/24
    ports:
      - "4002:4002"
    volumes:
      - ibgateway_config:/home/ibgateway
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/4002 && exec 3>&-' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - pantheon

  # ── Autoheal — restart unhealthy containers automatically ──────
  # Watches for containers with label autoheal=true that go unhealthy
  # and restarts them. Recovers IBGateway when port 4002 stops responding
  # without requiring manual intervention.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: pantheon_autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - pantheon

  # ── ZEUS Pipeline Server ────────────────────────────────────────
  zeus:
    image: ghcr.io/eugnmueller-87/pantheon:latest
    container_name: pantheon_zeus
    restart: always
    command: python main.py --port 8080
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - TZ=Europe/Berlin
    volumes:
      - zeus_knowledge:/app/knowledge
      - zeus_config:/app/config
      - zeus_data:/app/data
      - chroma_model_cache:/home/pantheon/.cache/chroma  # cache ONNX model — prevents 79MB re-download on every restart
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # ChromaDB model init can take 2+ min on cold start
    depends_on:
      - redis
    networks:
      - pantheon

  # ── Hermes Producer — decoupled signal fetcher ─────────────────
  # Runs agents/hermes_local.run_cycle() every 30 min as its own process.
  # Own failure domain: a crash here does not affect Zeus or the pipeline.
  # Writes to Supabase `signals` table; Icarus in Zeus reads from there.
  # (Was accidentally deleted in 2b24338 with an unrelated infra fix, which
  #  silently stopped all new signals — restored.)
  hermes-producer:
    image: ghcr.io/eugnmueller-87/pantheon:latest
    container_name: pantheon_hermes_producer
    restart: unless-stopped
    command: python run_hermes_producer.py
    env_file: .env
    environment:
      - TZ=Europe/Berlin
      - HERMES_LOCAL_INTERVAL=1800
    networks:
      - pantheon

  # ── Dashboard Backend ───────────────────────────────────────────
  dashboard:
    image: ghcr.io/eugnmueller-87/pantheon:latest
    container_name: pantheon_dashboard
    restart: always
    command: python -m uvicorn dashboard.backend.server:app --host 0.0.0.0 --port 8081
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      - TZ=Europe/Berlin
    volumes:
      - chroma_model_cache:/home/pantheon/.cache/chroma  # shared cache with zeus — model downloaded once
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # ChromaDB model init can take 2+ min on cold start
    networks:
      - pantheon

  # ── Grafana — Analytics Dashboards ─────────────────────────────
  # Connects directly to Supabase Postgres as datasource.
  # No ETL needed — Grafana reads your trades/portfolio tables live.
  grafana:
    image: grafana/grafana:11.0.0
    container_name: pantheon_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SERVER_ROOT_URL=https://moremanamoreproblems.de/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_PROTOCOL=http
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel
      # Supabase Postgres connection (injected at startup via provisioning)
      - SUPABASE_DB_HOST=${SUPABASE_DB_HOST}
      - SUPABASE_DB_PORT=${SUPABASE_DB_PORT:-5432}
      - SUPABASE_DB_NAME=${SUPABASE_DB_NAME:-postgres}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER:-postgres}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pantheon


  # ── Redis (local fallback cache) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pantheon_redis
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - pantheon

  # ── Nginx reverse proxy ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pantheon_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./grafana.htpasswd:/etc/nginx/grafana.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      zeus:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      grafana:
        condition: service_healthy
    networks:
      - pantheon

volumes:
  zeus_knowledge:
  zeus_config:
  zeus_data:
  chroma_model_cache:  # ChromaDB ONNX embedding model — cached across restarts to prevent CPU spike on cold start
  grafana_data:
  redis_data:
  ibgateway_config:

networks:
  pantheon:
    driver: bridge
